name: Build app

on:
  push:
    tags:
      - '**'

env:
  CARGO_TERM_COLOR: always

jobs:
  build_rust_linux:
    name: Linux - Rust app
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@main
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.7.3
        with:
          prefix-key: "cache-ubuntu"
      - run: cargo build --release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-rust-linux
          retention-days: 1
          path: |
            ./target/release/portfolio-server
            ${{ steps.compile.outputs.BUILT_ARCHIVE }}
            ${{ steps.compile.outputs.BUILT_CHECKSUM }}

  build_web_app:
    name: Web app
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@main
      - working-directory: ./web_client
        run: npm install
      - working-directory: ./web_client
        run: npm run prod
      - uses: actions/upload-artifact@main
        with:
          name: webapp-artifact
          retention-days: 1
          path: ./web_client/public/*

  package:
    name: Upload release
    runs-on: ubuntu-22.04
    needs: [build_rust_windows, build_rust_linux, build_web_app]
    steps:
      # Download generated artifacts
      - name: Retrieve artifact Rust/Linux
        uses: actions/download-artifact@main
        with:
          name: artifact-rust-linux
          path: ./artifact_rust_linux

      - name: Retrieve artifact Web app
        uses: actions/download-artifact@main
        with:
          name: webapp-artifact
          path: ./artifact_web_app/public

      # Download Pdfium binaries
      - run: wget https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-linux-x64.tgz
      - run: tar zxvf pdfium-linux-x64.tgz

      # Create Linux server zip
      - run: mkdir portfolio
      - run: mkdir portfolio/migrations
      - run: cp ./lib/libpdfium.so ./portfolio/
      - run: mv ./artifact_rust_linux/target/release/portfolio-server ./portfolio/
      - run: cp -r ./artifact_web_app/* ./portfolio/
      - run: zip -r portfolio_server_linux.zip ./portfolio/
      - run: rm -r ./portfolio

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            portfolio_server_linux.zip
